function daysUntil(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr + "T00:00:00");
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.round((target - now) / 86400000);
}

async function sbGet(table) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*`, { headers: sbHeaders });
  if (!res.ok) throw new Error(`Failed to load ${table}`);
  return res.json();
}
async function sbInsert(table, row) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
    method: "POST",
    headers: { ...sbHeaders, Prefer: "return=representation" },
    body: JSON.stringify(row),
  });
  if (!res.ok) throw new Error(`Failed to add to ${table}: ${await res.text()}`);
  return res.json();
}
async function sbUpdate(table, id, patch) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: "PATCH",
    headers: { ...sbHeaders, Prefer: "return=representation" },
    body: JSON.stringify(patch),
  });
  if (!res.ok) throw new Error(`Failed to update ${table}: ${await res.text()}`);
  return res.json();
}
async function sbDelete(table, id) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method: "DELETE", headers: sbHeaders });
  if (!res.ok) throw new Error(`Failed to delete from ${table}`);
}

// Generic list-backed table (tasks, contacts, timeline, designs). `save(nextArray)` diffs
// against what's currently loaded and issues the right inserts/updates/deletes.
function useSupabaseList(table, mapIn = (x) => x, mapOut = (x) => x) {
  const [rows, setRows] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const data = await sbGet(table);
        if (!cancelled) setRows((data || []).map(mapIn));
      } catch (e) {
        if (!cancelled) setError(e.message);
      } finally {
        if (!cancelled) setLoaded(true);
      }
    })();
    return () => { cancelled = true; };
  }, [table]);

  const save = useCallback(async (nextArr) => {
    setRows((prevRows) => {
      const prevMap = new Map(prevRows.map((r) => [r.id, r]));
      const nextMap = new Map(nextArr.map((r) => [r.id, r]));
      const deletions = prevRows.filter((r) => !nextMap.has(r.id));
      const insertions = nextArr.filter((r) => !prevMap.has(r.id));
      const updates = nextArr.filter((r) => prevMap.has(r.id) && JSON.stringify(prevMap.get(r.id)) !== JSON.stringify(r));

      (async () => {
        try {
          await Promise.all(deletions.map((r) => sbDelete(table, r.id)));
          await Promise.all(insertions.map((r) => sbInsert(table, mapOut(r))));
          await Promise.all(updates.map((r) => sbUpdate(table, r.id, mapOut(r))));
        } catch (e) {
          setError(e.message);
        }
      })();

      return nextArr;
    });
  }, [table]);

  return [rows, save, loaded, error];
}

// wedding_settings is a single row, not a list.
function useSupabaseSettings() {
  const [info, setInfo] = useState({ partner1: "", partner2: "", venue: "", functions: DEFAULT_FUNCTIONS() });
  const [rowId, setRowId] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    (async () => {
      try {
        const rows = await sbGet("wedding_settings");
        if (rows && rows.length) {
          const r = rows[0];
          setRowId(r.id);
          setInfo({
            partner1: r.partner1 || "",
            partner2: r.partner2 || "",
            venue: r.venue || "",
            functions: r.functions && r.functions.length ? r.functions : DEFAULT_FUNCTIONS(),
          });
        }
      } catch (e) {
        setError(e.message);
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  const save = useCallback(async (next) => {
    setInfo(next);
    try {
      if (rowId) {
        await sbUpdate("wedding_settings", rowId, { partner1: next.partner1, partner2: next.partner2, venue: next.venue, functions: next.functions });
      } else {
        const created = await sbInsert("wedding_settings", next);
        if (created && created[0]) setRowId(created[0].id);
      }
    } catch (e) {
      setError(e.message);
    }
  }, [rowId]);

  return [info, save, loaded, error];
}

}

function Seal({ days, label }) {
  let val, sub;
  if (days === null) { val = "—"; sub = "set your dates"; }
  else if (days > 0) { val = days; sub = `${days === 1 ? "day" : "days"} to ${label || "go"}`; }
  else if (days === 0) { val = "today"; sub = label || "it's the day"; }
  else { val = "done"; sub = `${label || "event"} passed`; }

  return (
    <div
      className="flex flex-col items-center justify-center rounded-full shrink-0"
      style={{
        width: 108, height: 108,
        border: `2px solid ${GOLD}`,
        boxShadow: `0 0 0 4px ${PAPER}, 0 0 0 5px ${LINE}`,
        background: `radial-gradient(circle at 35% 30%, #fff, ${PAPER})`,
      }}
    >
      <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: typeof val === "number" ? 30 : 15, fontWeight: 600, color: WINE, lineHeight: 1 }}>
        {val}
      </span>

        {sub}
      </span>
    </div>
  );
}

function nextFunction(functions) {
  const withDates = (functions || []).filter((f) => f.date);
  const upcoming = withDates.filter((f) => daysUntil(f.date) >= 0).sort((a, b) => a.date.localeCompare(b.date));
  if (upcoming.length) return upcoming[0];
  if (withDates.length) return withDates.sort((a, b) => b.date.localeCompare(a.date))[0];
  return null;
}

// ---------- Overview ----------
function Overview({ info, tasks, contacts, timeline, designs, setTab }) {
  const done = tasks.filter((t) => t.done).length;
  const spent = tasks.reduce((s, t) => s + (Number(t.actual) || 0), 0);
  const estimated = tasks.reduce((s, t) => s + (Number(t.estimated) || 0), 0);
  const upcoming = tasks.filter((t) => !t.done).sort((a, b) => (a.dueDate || "9999").localeCompare(b.dueDate || "9999")).slice(0, 5);
  const nf = nextFunction(info.functions);

  const stats = [
    { label: "Tasks done", value: `${done}/${tasks.length}`, icon: ListChecks, tab: "checklist" },
    { label: "Budget spent", value: money(spent), sub: estimated ? `of ${money(estimated)}` : null, icon: Wallet, tab: "budget" },
    { label: "Contacts", value: contacts.length, icon: Users, tab: "contacts" },
    { label: "Design ideas", value: designs.length, icon: ImageIcon, tab: "designs" },
  ];

  return (
    <div className="flex flex-col gap-8">
      <div className="flex items-center gap-6 flex-wrap">
        <Seal days={nf ? daysUntil(nf.date) : null} label={nf ? nf.name : null} />

          </h1>
          <p style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 13, color: INK, opacity: 0.6, marginTop: 4 }}>
            {info.venue || "Venue not set"}
          </p>
          <div className="flex gap-2 flex-wrap mt-2">
            {(info.functions || []).map((f) => (
              <span key={f.id} className="px-2.5 py-1 rounded-full" style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 11, background: CARD, border: `1px solid ${LINE}`, color: INK }}>
                <b style={{ color: WINE }}>{f.name}</b>{f.date ? ` · ${new Date(f.date + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" })}` : " · no date"}
              </span>
            ))}
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
        {stats.map((s) => (
          <button
            key={s.label}
            onClick={() => setTab(s.tab)}
            className="flex flex-col gap-2 p-4 rounded-lg text-left transition-transform hover:-translate-y-0.5"
            style={{ background: CARD, border: `1px solid ${LINE}` }}
          >
            <s.icon size={16} color={WINE} strokeWidth={1.75} />
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 20, fontWeight: 600, color: INK }}>{s.value}</span>
            <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 11, color: INK, opacity: 0.55 }}>
              {s.label}{s.sub ? ` ${s.sub}` : ""}
            </span>
          </button>
        ))}
      </div>

      <div>
        <SectionLabel>Coming up</SectionLabel>
        {upcoming.length === 0 ? (
          <p style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 13, color: INK, opacity: 0.5 }}>Nothing outstanding — add tasks in the checklist.</p>
        ) : (
          <div className="flex flex-col gap-2">
            {upcoming.map((t) => (
              <div key={t.id} className="flex items-center justify-between px-4 py-3 rounded-md" style={{ background: CARD, border: `1px solid ${LINE}` }}>

        )}
      </div>
    </div>
  );
}

// ---------- Designs (upload a photo, or pin a link) ----------
function resizeImageFile(file, maxDim = 1400, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.onload = () => {
      const img = new window.Image();
      img.onerror = () => reject(new Error("Could not decode image"));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
          else { width = Math.round((width * maxDim) / height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("Could not process image"))), "image/jpeg", quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  const remove = (id) => save(designs.filter((d) => d.id !== id));

    }
  };

  const visible = filter === "All" ? designs : designs.filter((d) => d.category === filter);

  return (
    <div>
      <p style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 12, color: INK, opacity: 0.45, marginBottom: 14 }}>
        Upload a photo directly from your device, or pin an image link instead.
      </p>
      <div className="flex items-center justify-between flex-wrap gap-3 mb-5">
        <div className="flex gap-2 flex-wrap">
          {["All", ...DESIGN_CATEGORIES].map((p) => (
            <button
              key={p}
              onClick={() => setFilter(p)}
              className="px-3 py-1.5 rounded-full text-xs transition-colors"
              style={{ fontFamily: "'Work Sans', sans-serif", background: filter === p ? WINE : "transparent", color: filter === p ? "#fff" : INK, border: `1px solid ${filter === p ? WINE : LINE}` }}
            >
              {p}
            </button>
          ))}
        </div>
        <PrimaryBtn onClick={() => (showForm ? setShowForm(false) : (setForm(blank), setMode("upload"), setUploadError(""), setShowForm(true)))}>{showForm ? <X size={14} /> : <Plus size={14} />} {showForm ? "Cancel" : "Add design"}</PrimaryBtn>
      </div>

      {showForm && (
        <div className="p-4 rounded-lg mb-6 flex flex-col gap-3" style={{ background: CARD, border: `1px solid ${LINE}` }}>
          <div className="flex gap-2">
            {[{ id: "upload", label: "Upload photo" }, { id: "link", label: "Paste link" }].map((m) => (
              <button
                key={m.id}
                onClick={() => { setMode(m.id); setForm((f) => ({ ...f, imageUrl: "" })); setUploadError(""); }}
                className="px-3 py-1.5 rounded-full text-xs"
                style={{ fontFamily: "'Work Sans', sans-serif", background: mode === m.id ? WINE : "transparent", color: mode === m.id ? "#fff" : INK, border: `1px solid ${mode === m.id ? WINE : LINE}` }}
              >
                {m.label}
              </button>
            ))}
          </div>

          <div className="grid sm:grid-cols-2 gap-3">
            <TextField label="Title" value={form.title} onChange={(v) => setForm({ ...form, title: v })} placeholder="Stage backdrop idea" />
            <SelectField label="Category" value={form.category} onChange={(v) => setForm({ ...form, category: v })} options={DESIGN_CATEGORIES.map((c) => ({ value: c, label: c }))} />

            {mode === "upload" ? (
              <div className="sm:col-span-2 flex flex-col gap-2">
                <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 11, letterSpacing: "0.05em", textTransform: "uppercase", color: INK, opacity: 0.55 }}>Photo</span>
                <input type="file" accept="image/*" onChange={handleFile} style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 13, color: INK }} />
                {uploading && <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 12, color: INK, opacity: 0.5 }}>Processing photo…</span>}
                {uploadError && <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 12, color: "#A33" }}>{uploadError}</span>}
                {form.imageUrl && (
                  <img src={form.imageUrl} alt="Preview" style={{ width: 120, height: 120, objectFit: "cover", borderRadius: 8, border: `1px solid ${LINE}` }} />
                )}
              </div>
            ) : (
              <TextField label="Image link" value={form.imageUrl} onChange={(v) => setForm({ ...form, imageUrl: v })} placeholder="https://… (must be a direct image URL)" className="sm:col-span-2" />
            )}

            <TextField label="Source link" value={form.sourceUrl} onChange={(v) => setForm({ ...form, sourceUrl: v })} placeholder="Optional — where it came from" />
            <TextField label="Notes" value={form.notes} onChange={(v) => setForm({ ...form, notes: v })} placeholder="Optional" />
          </div>
          <div><PrimaryBtn onClick={add}><Check size={14} /> Pin design</PrimaryBtn></div>
        </div>
      )}

      {visible.length === 0 ? (
        <p style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 13, color: INK, opacity: 0.45 }}>No designs pinned yet.</p>
      ) : (
        <div className="grid sm:grid-cols-2 gap-3">
          {visible.map((d) => (
            <div key={d.id} className="rounded-lg overflow-hidden" style={{ background: CARD, border: `1px solid ${LINE}` }}>
              <div style={{ width: "100%", aspectRatio: "4/3", background: PAPER, display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
                <img
                  src={d.imageUrl}
                  alt={d.title}
                  style={{ width: "100%", height: "100%", objectFit: "cover" }}
                  onError={(e) => { e.target.style.display = "none"; e.target.nextSibling.style.display = "flex"; }}
                />
                <div style={{ display: "none", flexDirection: "column", alignItems: "center", gap: 4, color: INK, opacity: 0.4 }}>
                  <ImageIcon size={22} />
                  <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 11 }}>Image couldn't load</span>
                </div>
              </div>
              <div className="p-3">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <span style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 17, fontWeight: 600, color: INK }}>{d.title}</span>
                    <div style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 11, color: WINE, marginTop: 1 }}>{d.category}</div>
                  </div>
                  <IconBtn danger title="Remove" onClick={() => remove(d.id)}><Trash2 size={14} /></IconBtn>
                </div>
                {d.notes && <p style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 12, color: INK, opacity: 0.55, marginTop: 4 }}>{d.notes}</p>}
                {d.sourceUrl && (
                  <a href={d.sourceUrl} target="_blank" rel="noreferrer" className="flex items-center gap-1 mt-2" style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 11, color: SAGE }}>
                    <LinkIcon size={11} /> Source
                  </a>
                )}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ---------- Wedding info editor (partners, venue, function dates) ----------
function InfoEditor({ info, save, onClose }) {
  const [form, setForm] = useState({ ...info, functions: info.functions && info.functions.length ? info.functions : DEFAULT_FUNCTIONS() });

  const updateFn = (id, patch) => setForm({ ...form, functions: form.functions.map((f) => (f.id === id ? { ...f, ...patch } : f)) });
  const addFn = () => setForm({ ...form, functions: [...form.functions, { id: uid(), name: "", date: "" }] });
  const removeFn = (id) => setForm({ ...form, functions: form.functions.filter((f) => f.id !== id) });

  return (
    <div className="p-4 rounded-lg mb-6 flex flex-col gap-4" style={{ background: CARD, border: `1px solid ${LINE}` }}>
      <div className="grid sm:grid-cols-2 gap-3">
        <TextField label="Partner one" value={form.partner1} onChange={(v) => setForm({ ...form, partner1: v })} />
        <TextField label="Partner two" value={form.partner2} onChange={(v) => setForm({ ...form, partner2: v })} />
        <TextField label="Venue" value={form.venue} onChange={(v) => setForm({ ...form, venue: v })} className="sm:col-span-2" />
      </div>
      <div>
        <span style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 11, letterSpacing: "0.05em", textTransform: "uppercase", color: INK, opacity: 0.55 }}>Functions</span>
        <div className="flex flex-col gap-2 mt-2">
          {form.functions.map((f) => (
            <div key={f.id} className="flex items-center gap-2">
              <input value={f.name} onChange={(e) => updateFn(f.id, { name: e.target.value })} placeholder="Function name" className="px-3 py-2 rounded-md outline-none flex-1" style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 13, color: INK, background: PAPER, border: `1px solid ${LINE}` }} />
              <input type="date" value={f.date} onChange={(e) => updateFn(f.id, { date: e.target.value })} className="px-3 py-2 rounded-md outline-none" style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 13, color: INK, background: PAPER, border: `1px solid ${LINE}` }} />
              <IconBtn danger title="Remove function" onClick={() => removeFn(f.id)}><Trash2 size={14} /></IconBtn>
            </div>
          ))}
        </div>
        <GhostBtn onClick={addFn}><Plus size={12} /> Add function</GhostBtn>
      </div>
      <div>
        <PrimaryBtn onClick={() => { save(form); onClose(); }}><Check size={14} /> Save details</PrimaryBtn>
      </div>
    </div>
  );
}

const PASSCODE = "ZiaFatima786";

function LockScreen({ onUnlock }) {
  const [value, setValue] = useState("");
  const [error, setError] = useState(false);

  const submit = () => {
    if (value.trim().toLowerCase() === PASSCODE.toLowerCase()) {
      onUnlock();
    } else {
      setError(true);
    }
  };

  return (
    <div style={{ background: PAPER, minHeight: "100vh", fontFamily: "'Work Sans', sans-serif", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <style>{FONT_IMPORT}</style>
      <div className="w-full max-w-sm flex flex-col items-center gap-5 p-6 rounded-lg" style={{ background: CARD, border: `1px solid ${LINE}` }}>
        <div className="flex flex-col items-center justify-center rounded-full" style={{ width: 56, height: 56, border: `2px solid ${GOLD}`, background: PAPER }}>
          <Lock size={22} color={WINE} strokeWidth={1.75} />
        </div>
        <div className="text-center">
          <h1 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 26, fontWeight: 700, color: INK }}>Zia <span style={{ color: GOLD }}>&</span> Fatima</h1>
          <p style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 12, color: INK, opacity: 0.55, marginTop: 2 }}>Enter the family passcode to continue</p>
        </div>
        <input
          type="password"
          value={value}
          onChange={(e) => { setValue(e.target.value); setError(false); }}
          onKeyDown={(e) => e.key === "Enter" && submit()}
          placeholder="Passcode"
          autoFocus
          className="w-full px-3 py-2.5 rounded-md outline-none text-center"
          style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 15, color: INK, background: PAPER, border: `1px solid ${error ? "#A33" : LINE}` }}
        />
        {error && <p style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 12, color: "#A33", marginTop: -12 }}>That's not quite right — try again.</p>}
        <PrimaryBtn onClick={submit} style={{ width: "100%", justifyContent: "center" }}><Check size={14} /> Unlock</PrimaryBtn>
      </div>
    </div>
  );
}

function WeddingManager() {
  const [unlocked, setUnlocked] = useState(false);
  if (!unlocked) return <LockScreen onUnlock={() => setUnlocked(true)} />;
  return <WeddingManagerApp />;
}

function WeddingManagerApp() {
  const [info, saveInfo, infoLoaded, infoErr] = useSupabaseSettings();
  const [tasks, saveTasks, tasksLoaded, tasksErr] = useSupabaseList("tasks", taskFromDb, taskToDb);
  const [contacts, saveContacts, contactsLoaded, contactsErr] = useSupabaseList("contacts", identity, identity);
  const [timeline, saveTimeline, timelineLoaded, timelineErr] = useSupabaseList("timeline", identity, identity);
  const [designs, saveDesigns, designsLoaded, designsErr] = useSupabaseList("designs", designFromDb, designToDb);
  const connectionError = infoErr || tasksErr || contactsErr || timelineErr || designsErr;
  const [tab, setTab] = useState("overview");
  const [editingInfo, setEditingInfo] = useState(false);

  const ready = infoLoaded && tasksLoaded && contactsLoaded && timelineLoaded && designsLoaded;

  const tabs = [
    { id: "overview", label: "Overview", icon: Heart },
    { id: "checklist", label: "Checklist", icon: ListChecks },
    { id: "contacts", label: "Contacts", icon: Users },
    { id: "budget", label: "Budget", icon: Wallet },
    { id: "timeline", label: "Run Sheet", icon: Clock },
    { id: "designs", label: "Designs", icon: ImageIcon },
  ];

  return (
    <div style={{ background: PAPER, minHeight: "100vh", fontFamily: "'Work Sans', sans-serif" }}>
      <style>{FONT_IMPORT}</style>
      <div className="max-w-3xl mx-auto px-4 sm:px-8 py-8">
        {!ready ? (
          <p style={{ color: INK, opacity: 0.5, fontSize: 13 }}>Loading your wedding details…</p>
        ) : connectionError ? (
          <div className="p-4 rounded-lg" style={{ background: "#FCEBEC", border: "1px solid #E3AEB3" }}>
            <p style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 13, color: "#A33", fontWeight: 500 }}>Couldn't connect to the database</p>
            <p style={{ fontFamily: "'Work Sans', sans-serif", fontSize: 12, color: "#A33", opacity: 0.8, marginTop: 4 }}>{connectionError}</p>
          </div>
        ) : (
          <>
            <div className="flex items-center justify-between mb-6">
              <div className="flex gap-1 overflow-x-auto" style={{ borderBottom: `1px solid ${LINE}` }}>
                {tabs.map((t) => (
                  <button
                    key={t.id}
                    onClick={() => setTab(t.id)}
                    className="flex items-center gap-1.5 px-3 py-2 whitespace-nowrap transition-colors"
                    style={{
                      fontFamily: "'Work Sans', sans-serif",
                      fontSize: 13,
                      color: tab === t.id ? WINE : INK,
                      opacity: tab === t.id ? 1 : 0.55,
                      borderBottom: `2px solid ${tab === t.id ? WINE : "transparent"}`,
                      marginBottom: -1,
                    }}
                  >
                    <t.icon size={14} /> {t.label}
                  </button>
                ))}
              </div>
              {tab === "overview" && (
                <IconBtn title="Edit wedding details" onClick={() => setEditingInfo((s) => !s)}><Pencil size={15} /></IconBtn>
              )}
            </div>

            {tab === "overview" && editingInfo && <InfoEditor info={info} save={saveInfo} onClose={() => setEditingInfo(false)} />}

            {tab === "overview" && <Overview info={info} tasks={tasks} contacts={contacts} timeline={timeline} designs={designs} setTab={setTab} />}
            {tab === "checklist" && <Checklist tasks={tasks} save={saveTasks} contacts={contacts} saveContacts={saveContacts} />}
            {tab === "contacts" && <Contacts contacts={contacts} save={saveContacts} />}
            {tab === "budget" && <Budget tasks={tasks} contacts={contacts} setTab={setTab} />}
            {tab === "timeline" && <Timeline timeline={timeline} save={saveTimeline} functions={info.functions} />}
            {tab === "designs" && <Designs designs={designs} save={saveDesigns} />}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<WeddingManager />);
</script>
</body>
</html>
